# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-communication"
BBFILE_PATTERN_meta-communication = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-communication = "6"

LAYERDEPENDS_meta-communication = "core"
LAYERSERIES_COMPAT_meta-communication = "kirkstone"
